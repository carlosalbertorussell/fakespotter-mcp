name: Classifier Health Check

on:
  schedule:
    # First Monday of every month at 08:00 UTC
    - cron: '0 8 1-7 * 1'
  workflow_dispatch:
    inputs:
      open_issue:
        description: 'Open GitHub issue if degraded'
        required: false
        default: 'true'

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install httpx

      - name: Run health check
        id: health
        env:
          FAKESPOTTER_HF_TOKEN: ${{ secrets.FAKESPOTTER_HF_TOKEN }}
        run: |
          python scripts/health_check.py \
            --hf-token "$FAKESPOTTER_HF_TOKEN" \
            && echo "status=ok" >> $GITHUB_OUTPUT \
            || echo "status=degraded" >> $GITHUB_OUTPUT

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_id }}
          path: docs/health_report.md
          retention-days: 90

      - name: Open issue if degraded
        if: steps.health.outputs.status == 'degraded'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('docs/health_report.md')
              ? fs.readFileSync('docs/health_report.md', 'utf8')
              : 'Report not available.';

            const today = new Date().toISOString().split('T')[0];
            const title = `[Classifier Health] Degraded backend detected — ${today}`;

            // Check for existing open issue with same title prefix
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'classifier-health',
            });

            const existing = issues.find(i => i.title.startsWith('[Classifier Health]'));
            if (existing) {
              console.log(`Issue already open: ${existing.html_url} — skipping`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `## Automated classifier health alert\n\n${report}\n\n---\n*Generated by [classifier-health workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`,
              labels: ['classifier-health'],
            });
