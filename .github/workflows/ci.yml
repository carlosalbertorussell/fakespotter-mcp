name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  docs-sync:
    name: docs sync gate (pre-merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check README tool count matches ci_check.py EXPECTED_TOOLS
        run: python scripts/check_docs_sync.py

  arranque:
    name: install + arranque + inventario de tools
    runs-on: ubuntu-latest
    needs: docs-sync
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Versiones resueltas
        run: pip list
      - name: Arranque e inventario de tools
        run: python scripts/ci_check.py
      - name: Regression tests (neural wiring + statistical fallback)
        run: python scripts/regression_test.py
